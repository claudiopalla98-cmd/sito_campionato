// ---- Scheda squadra ----
function team(i){if(cur<4)back=cur;const g=G[i],mm=M.filter(m=>m.h==i||m.a==i);
let h=`<button class="back" id="bk">‹ Indietro</button><div class="tn big">${logo(i,52)}${T[i]}</div>`;
h+=`<h2>Palestra</h2><div class="card"><div class="map" id="map"></div><div class="row" style="margin-top:.8rem"><div><b>${g.n}</b><br><span style="color:var(--muted);font-size:.88rem">${g.a}</span></div><a class="btn" href="${dir(g)}" target="_blank" rel="noopener">Indicazioni</a></div></div>`;
h+=`<h2>Classifica</h2>${tbl(i)}<h2>Calendario</h2>`+mm.map(m=>`<div class="gh" style="margin:.7rem .3rem .4rem"><b>Giornata ${m.g}</b></div>${mrow(m,i)}`).join('');
$('#v4').innerHTML=h;$('#bk').onclick=()=>go(back);show(4);drawMap($('#map'),i)}
function drawMap(el,i){const la=G.map(g=>g.la),lo=G.map(g=>g.lo),a1=Math.max(...la),a0=Math.min(...la),o0=Math.min(...lo),o1=Math.max(...lo),H=i<0?340:230,kx=Math.cos(45.65*Math.PI/180),dx=(o1-o0)*kx,dy=a1-a0,sk=Math.min(320/dx,(H-90)/dy),P=g=>[200+((g.lo-o0)*kx-dx/2)*sk,H/2+((a1-g.la)-dy/2)*sk],nm=g=>g.n.split(' · ')[1];
const pn=(g,k,sc)=>{const[x,y]=P(g);return `<g data-t="${k}" transform="translate(${x} ${y}) scale(${sc})" style="cursor:pointer"><path d="M0 0C-16-18-16-38 0-38S16-18 0 0z" fill="#f2c230" stroke="#211c0e" stroke-width="2.5"/><circle cy="-25" r="5" fill="#211c0e"/><text y="${17/sc}" font-size="${(i<0?8:11)/sc}" font-weight="700" text-anchor="middle" fill="currentColor">${nm(g)}</text></g>`};
const dot=(g,k)=>{const[x,y]=P(g);return `<g data-t="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="9" fill="#a39a74" opacity=".9"/><text x="${x}" y="${y+22}" font-size="10" text-anchor="middle" fill="currentColor">${nm(g)}</text></g>`};
const body=G.map((g,k)=>i<0?pn(g,k,.8):k==i?'':dot(g,k)).join('')+(i>=0?pn(G[i],i,1):'');
el.classList.add('lock');
el.innerHTML=`<svg viewBox="0 0 400 ${H}" style="color:var(--ink)"><path d="M-20 175C70 120 150 215 250 150S380 125 430 165" stroke="#b9d6e6" stroke-width="12" fill="none" opacity=".8"/><path d="M0 60L400 100M120 0L180 230M300 0L250 230" stroke="#fff" stroke-width="5" opacity=".55" fill="none"/>${body}</svg><div class="hint">Tocca per muovere la mappa</div><div class="z"><button data-z=".7">+</button><button data-z="1.4">−</button></div>`;
const sv=el.querySelector('svg'),w0=240;let v=[0,0,400,H],dn=null;if(i>=0){const[px,py]=P(G[i]);v=[px-w0/2,py-18-w0*230/800,w0,w0*230/400]}
const set=()=>sv.setAttribute('viewBox',v.join(' '));set();
el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const f=+b.dataset.z,cx=v[0]+v[2]/2,cy=v[1]+v[3]/2,w=Math.min(400,Math.max(90,v[2]*f)),h=w*H/400;v=[cx-w/2,cy-h/2,w,h];set()});
sv.onclick=e=>{if(!e.target.closest('[data-t]'))el.classList.remove('lock')};
sv.onpointerdown=e=>{dn={x:e.clientX,y:e.clientY,m:0}};
sv.onpointermove=e=>{if(!dn||el.classList.contains('lock'))return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(!dn.m&&Math.hypot(dx,dy)<5)return;if(!dn.m){dn.m=1;sv.setPointerCapture(e.pointerId)}const k=v[2]/sv.clientWidth;v[0]-=dx*k;v[1]-=dy*k;dn.x=e.clientX;dn.y=e.clientY;set()};
sv.onpointerup=sv.onpointercancel=()=>dn=null}
// ---- inizializzazione e navigazione ----
let cur=0,back=0;const bs=[...document.querySelectorAll('#nav button')],show=i=>{document.querySelectorAll('.view').forEach((v,j)=>v.classList.toggle('on',i==j));scrollTo({top:0})};
let ni=0;function go(i){const fr=cur==4;cur=i;ni=i;bs.forEach((x,j)=>x.classList.toggle('on',i==j));$('#nav').style.setProperty('--i',i);show(i);if(fr){const v=document.querySelectorAll('.view')[i];v.classList.add('pop');setTimeout(()=>v.classList.remove('pop'),520)}navigator.vibrate&&navigator.vibrate(6)}
bs.forEach((b,i)=>b.onclick=()=>go(i));
document.addEventListener('click',e=>{if(e.target.closest('[data-cal]'))return openCal();if(e.target.closest('[data-ics]'))return ics();if(e.target.closest('[data-x]')||e.target.id=='sh'){SH.hidden=true;return}const t=e.target.closest('[data-t]');if(t){const i=+t.dataset.t;if(cur<4)back=cur;cur=4;team(i);return}const dd=e.target.closest('[data-d]');if(dd){DEMO=dd.dataset.d=='1';load(RAW);render();return}const p=e.target.closest('[data-p]');if(p){PREV=p.dataset.p||null;home();cal()}});
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'};
render();
// ---- Liquid glass: barra alta che si compatta, tab bar trascinabile con inerzia, sheet trascinabile ----
const hd=$('.hd');let sc=0;addEventListener('scroll',()=>{const y=scrollY,on=sc?y>8:y>40;if(on!=!!sc){sc=+on;hd.classList.toggle('sc',on)}},{passive:true});
const nv=$('#nav');let ds=null;
nv.addEventListener('pointerdown',e=>{const r=nv.getBoundingClientRect();ds={r,w:(r.width-12)/4,x:e.clientX,lx:e.clientX,t:e.timeStamp,v:0,on:0,px:0};nv.classList.add('press');nv.style.setProperty('--sc',1.16)});
nv.addEventListener('pointermove',e=>{if(!ds)return;if(!ds.on){if(Math.abs(e.clientX-ds.x)<6)return;ds.on=1;nv.setPointerCapture(e.pointerId);nv.classList.add('drag')}const dt=e.timeStamp-ds.t||1;ds.v=.7*ds.v+.3*(e.clientX-ds.lx)/dt;ds.lx=e.clientX;ds.t=e.timeStamp;ds.px=Math.max(0,Math.min(3*ds.w,e.clientX-ds.r.left-6-ds.w/2));nv.style.setProperty('--dx',(ds.px-ni*ds.w)+'px')});
const rel=()=>{if(!ds)return;const d=ds;ds=null;nv.classList.remove('press','drag');nv.style.setProperty('--sc',1);nv.style.setProperty('--dx','0px');if(d.on)go(Math.max(0,Math.min(3,Math.round((d.px+d.v*99)/d.w))))};
nv.addEventListener('pointerup',rel);nv.addEventListener('pointercancel',rel);
SH.addEventListener('pointerdown',e=>{const g=e.target.closest('.gb');if(!g)return;const c=SH.querySelector('.shc'),y0=e.clientY,t0=e.timeStamp;let y=0,v=0;g.setPointerCapture(e.pointerId);c.style.animation='none';const mv=ev=>{y=Math.max(0,ev.clientY-y0);v=y/(ev.timeStamp-t0||1);c.style.transition='none';c.style.transform=`translateY(${y}px)`},up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);c.style.transition='transform .4s cubic-bezier(.32,.72,0,1)';if(y>90||v>.6){c.style.transform='translateY(110%)';setTimeout(()=>{SH.hidden=true},300)}else c.style.transform=''};g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up)});
// ---- Aggiornamento: ogni 5 minuti rilegge dati.json (se la pagina è su un server) ----
let CUR=EMB.aggiornato;
function upd(){const e=$('#upd');if(e)e.textContent=DEMO?'Dati di esempio':'Aggiornato '+new Date(RAW.aggiornato).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function render(){home();cal();stand();gyms();upd()}
async function refresh(){try{const r=await fetch('dati.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d.aggiornato!=CUR){CUR=d.aggiornato;load(d);render()}}catch(e){}}
setInterval(refresh,3e5);refresh();
</script></body></html>
