<title>Volley Rosà</title>
<style>:root{--bg:#f7f6f3;--sf:#fff;--sf2:#efeee9;--ink:#111110;--mut:#6b6a65;--line:rgba(17,17,16,.09);--acc:#ffc72c;--ok:#1f9d55;--ko:#d9392b;--gl:rgba(255,255,255,.62);--rim:rgba(255,255,255,.75);--glsh:rgba(20,18,10,.14);--pill:rgba(255,199,44,.42);--r:28px;--p:16px;--m:20px;--out:cubic-bezier(.23,1,.32,1);--spr:cubic-bezier(.3,1.3,.5,1);color-scheme:light}

:root[data-theme="dark"]{--bg:#0d0d0c;--sf:#171715;--sf2:#222220;--ink:#f2f1ec;--mut:#a09f98;--line:rgba(255,255,255,.09);--gl:rgba(40,40,36,.55);--rim:rgba(255,255,255,.14);--glsh:rgba(0,0,0,.5);--pill:rgba(255,199,44,.3);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0c;--sf:#171715;--sf2:#222220;--ink:#f2f1ec;--mut:#a09f98;--line:rgba(255,255,255,.09);--gl:rgba(40,40,36,.55);--rim:rgba(255,255,255,.14);--glsh:rgba(0,0,0,.5);--pill:rgba(255,199,44,.3);color-scheme:dark}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
::selection{background:var(--acc);color:#111}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}a{color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) var(--m) calc(128px + env(safe-area-inset-bottom,0px))}
.lt{font-size:clamp(26px,8vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:6px 0 24px}.sub span+span::before{content:"·";margin:0 8px}
h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:32px 0 12px}.view>h2:first-child{margin-top:8px}
/* barra alta: solo il colore di sfondo, nessuna macchia; sfuma verso lo stesso colore */
.hd{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(env(safe-area-inset-top,0px) + 52px);padding:env(safe-area-inset-top,0px) var(--m) 0;display:flex;align-items:center;justify-content:flex-end;pointer-events:none}.hd>*{pointer-events:auto}
.hd::before{content:"";position:absolute;inset:0 0 -16px;z-index:-1;pointer-events:none;background:linear-gradient(var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent);opacity:0;transition:opacity .25s var(--out)}.hd.sc::before{opacity:1}
.bt{position:absolute;left:50%;translate:-50% 3px;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;opacity:0;transition:opacity .2s,translate .3s var(--out)}.hd.sc .bt{opacity:1;translate:-50% 0}
/* livello flottante = unico posto con liquid glass */
.th,.back,nav,.map .hint,.map .z button{background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim),0 6px 20px var(--glsh)}
.th{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--out)}.th svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.back{height:36px;padding:0 14px 0 10px;border-radius:999px;font-size:15px;font-weight:600;margin-top:4px;transition:transform .2s var(--out)}
.th:active,.back:active,.btn:active,.chips button:active{transform:scale(.96)}
/* superfici piatte e concentriche: raggio interno = raggio esterno - padding */
.card{background:var(--sf);border-radius:var(--r);padding:var(--p);box-shadow:0 0 0 1px var(--line)}.card+.card{margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.empty{color:var(--mut);text-align:center;padding:24px}
.logo{display:grid;place-items:center;flex:none;border-radius:24%;background:var(--sf2);color:var(--ink);font-weight:700;object-fit:contain}img.logo{display:block;background:#fff;box-shadow:inset 0 0 0 1px rgba(17,17,16,.08)}
.tq{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}.tq:active,.sd:active{opacity:.6}
.tn{display:flex;align-items:center;gap:12px}.tn.big{font-size:28px;line-height:1.1;letter-spacing:-.025em;font-weight:700;margin-top:12px;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;text-decoration:none;transition:transform .2s var(--out)}
.btn.alt{background:var(--sf2);color:var(--ink)}.btn.wide{width:100%;margin-top:20px}.btn svg{width:16px;height:16px;fill:currentColor}
/* prossima partita */
.hero{background:var(--acc);color:#111;box-shadow:none;padding:20px var(--p) var(--p);text-align:center}
.eb{display:block;font-size:15px;font-weight:600;color:rgba(17,17,17,.7)}
.cd{display:flex;justify-content:center;gap:16px;margin:8px 0 20px}.cd span{display:inline-flex;align-items:baseline;gap:2px}.cd b{font-size:26px;font-weight:650;letter-spacing:-.02em}.cd i{font-style:normal;font-size:13px;font-weight:600;color:rgba(17,17,17,.55)}
.st{display:inline-block;margin:8px 0 20px;padding:8px 14px;border-radius:999px;background:rgba(17,17,17,.08);font-size:14px;font-weight:600}
.gi{font-size:13px;font-weight:600;color:rgba(17,17,17,.6)}.qd{font-size:17px;font-weight:650;margin-top:2px}.qd::first-letter{text-transform:uppercase}
.vsr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:20px;align-items:start}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.sd{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.sn{font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.015em}.ora{margin-top:16px;font-size:28px;font-weight:700;letter-spacing:-.03em}
.ul{font-size:12px;font-weight:600;color:rgba(17,17,17,.55);margin-top:6px}.meta{font-size:13px;color:rgba(17,17,17,.6)}
.form{display:flex;gap:5px;justify-content:center}.form i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.form i svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.form .v{background:var(--ok)}.form .p{background:var(--ko)}
.info{margin-top:20px;padding-top:16px;border-top:1px solid rgba(17,17,17,.14);display:flex;flex-direction:column;align-items:center;gap:2px}
.info .pi{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;margin-bottom:4px}.info b{font-size:15px;font-weight:650}.info span{font-size:13px;color:rgba(17,17,17,.65)}
.hero .btn{background:#111;color:#fff;margin-top:12px}
/* partite: un solo contenitore per giornata, righe con filetti rientrati */
.grp{padding:0;overflow:hidden;margin-top:12px}.gt{display:flex;justify-content:space-between;align-items:baseline;padding:16px var(--p) 4px}
.gt b{font-size:17px;font-weight:700;letter-spacing:-.01em}.gt span{font-size:13px;color:var(--mut)}
.mx{padding:12px var(--p)}.mx+.mx{background-image:linear-gradient(var(--line),var(--line));background-size:calc(100% - 32px) 1px;background-position:var(--p) 0;background-repeat:no-repeat}
.mh{display:flex;align-items:center;font-size:12px;color:var(--mut);margin-bottom:4px}.me .mh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px}
.bd{font-style:normal;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;margin-left:8px;background:var(--ink);color:var(--bg)}.bd.wait{background:var(--sf2);color:var(--mut)}
.bd.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:5px;animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}
.tr{display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer}.tr:active{opacity:.6}
.nm{flex:1;min-width:0;font-size:16px;font-weight:500;line-height:1.25}.tr.wn .nm{font-weight:650}
.ps{display:flex;gap:2px;color:var(--mut);font-size:13px}.ps i{font-style:normal;width:22px;text-align:center}.ps i.w{color:var(--ink);font-weight:650}
.tot{width:28px;text-align:right;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--mut)}.tr.wn .tot{color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px calc(var(--m)*-1) 4px;padding:0 var(--m);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 16px;border-radius:999px;background:var(--sf);box-shadow:0 0 0 1px var(--line);font-size:14px;font-weight:550;transition:transform .2s var(--out),background .2s,color .2s}.chips button.on{background:var(--ink);color:var(--bg);box-shadow:none}
/* classifica: colonne fisse a sinistra, il resto scorre; sfumatura finché c'è altro da vedere */
.tb{padding:0;overflow:hidden}.tbs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}.tbs::-webkit-scrollbar{display:none}.tbs[data-end]{-webkit-mask-image:none;mask-image:none}
.tbs .r{display:grid;grid-template-columns:40px 176px repeat(8,48px);align-items:center;height:52px;width:max-content;background:var(--sf)}.tbs .r+.r>*{border-top:1px solid var(--line)}
.tbs .r>*{height:100%;display:flex;align-items:center;justify-content:center;font-size:15px}.tbs .r>b{font-weight:700}
.tbs .r>:nth-child(1){position:sticky;left:0;z-index:2;background:inherit;padding-left:var(--p);justify-content:flex-start;color:var(--mut);font-size:14px}
.tbs .r>:nth-child(2){position:sticky;left:40px;z-index:2;background:inherit;justify-content:flex-start;padding-right:8px;font-weight:600}
.tbs .r.h{height:40px}.tbs .r.h>*{font-size:12px;font-weight:600;color:var(--mut);border:0}.tbs .r.me{background:color-mix(in srgb,var(--acc) 22%,var(--sf))}
.leg{font-size:12px;color:var(--mut);margin:8px 4px 0}.legs{padding:0 4px}.legs h3{font-size:12px;font-weight:600;color:var(--mut);margin:20px 0 6px}.legs p{font-size:12px;line-height:1.45;color:var(--mut);margin:3px 0}.legs b{color:var(--ink)}
/* palestre e mappe */
.gym{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.gym .n{min-width:0}.gym .tq b{font-size:16px;font-weight:650}
.pz{display:block;font-size:14px;margin-top:6px}.vi{display:block;font-size:13px;color:var(--mut)}.gym .btn{height:36px;padding:0 14px;font-size:14px;flex:none}
.map{position:relative;height:240px;background:var(--sf2);overflow:hidden;z-index:0}#mp{height:340px}.map>svg{width:100%;height:100%;display:block;cursor:grab}.map.lock{touch-action:pan-y}
.card:has(>.map){padding:0;overflow:hidden}.card:has(>.map)>.row{padding:var(--p);margin-top:0!important}
.map .hint{position:absolute;left:12px;bottom:12px;z-index:1000;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;pointer-events:none}.map:not(.lock) .hint{display:none}
.map .z{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}.map .z button{width:36px;height:36px;border-radius:50%;font-size:18px}
.leaflet-popup-content{font-size:13px;line-height:1.4;color:#111}.map.leaflet-container{font:inherit}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
/* tab bar: stessa posizione e misure di Apple Music */
nav{position:fixed;left:50%;translate:-50% 0;bottom:max(12px,calc(env(safe-area-inset-bottom,0px) - 14px));width:min(calc(100vw - 42px),420px);z-index:30;padding:6px;border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 .5px var(--rim),0 12px 32px var(--glsh)}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:999px;background:var(--pill);box-shadow:inset 0 .5px 0 rgba(255,255,255,.6);translate:calc(var(--i,0)*100% + var(--dx,0px)) 0;scale:var(--sc,1);transition:translate .5s var(--spr),scale .35s var(--spr)}nav.drag .pill{transition:scale .35s var(--spr)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--mut);font-size:10px;font-weight:600;transition:color .15s}nav button.on,nav button.hot{color:var(--ink)}nav.drag button.on:not(.hot){color:var(--mut)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.edge{position:fixed;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none;background:linear-gradient(to top,var(--bg) 30%,transparent)}
/* movimento: curva esponenziale, poche cose, mai bloccante */
.view{display:none}.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes push{from{opacity:0;transform:translateX(24px)}}@keyframes pop{from{opacity:0;transform:translateX(-24px)}}
.view.enter>*{animation:rise .3s var(--out) both}.view.enter>:nth-child(2){animation-delay:30ms}.view.enter>:nth-child(3){animation-delay:60ms}.view.enter>:nth-child(4){animation-delay:90ms}.view.enter>:nth-child(n+5){animation-delay:120ms}
#v4.on>*,.view.pop>*{animation:none}#v4.on{animation:push .3s var(--out)}.view.pop{animation:pop .3s var(--out)}
@media (prefers-reduced-transparency:reduce){.th,.back,nav,.map .hint,.map .z button{background:var(--sf);-webkit-backdrop-filter:none;backdrop-filter:none}.hd::before{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
/* ===== v6: liquid glass, dettagli a scomparsa, robustezza ===== */
:root{--gc:rgba(255,255,255,.58);--hi:rgba(255,255,255,.95);--lo:rgba(17,17,16,.07);--drawer:cubic-bezier(.32,.72,0,1);--b1:rgba(255,199,44,.40);--b2:rgba(255,150,60,.16);--b3:rgba(255,214,90,.30)}
:root[data-theme="dark"]{--gc:rgba(36,36,33,.55);--hi:rgba(255,255,255,.2);--lo:rgba(0,0,0,.45);--b1:rgba(255,199,44,.16);--b2:rgba(255,120,40,.08);--b3:rgba(255,199,44,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gc:rgba(36,36,33,.55);--hi:rgba(255,255,255,.2);--lo:rgba(0,0,0,.45);--b1:rgba(255,199,44,.16);--b2:rgba(255,120,40,.08);--b3:rgba(255,199,44,.10)}}
/* luce d'ambiente sotto al vetro; il bordo alto resta di un solo colore (niente taglio sotto l'orario) */
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 380px at 90% 22%,var(--b1),transparent 70%),radial-gradient(360px 360px at 0% 58%,var(--b2),transparent 70%),radial-gradient(480px 440px at 15% 100%,var(--b3),transparent 70%);-webkit-mask:linear-gradient(transparent 0,transparent 24px,#000 180px);mask:linear-gradient(transparent 0,transparent 24px,#000 180px)}
.card:not(.hero),.chips button,.btn.alt,.th,.back{position:relative;-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
.card:not(.hero){background:var(--gc);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),0 12px 32px var(--glsh)}
.chips button{background:var(--gc);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),0 4px 14px var(--glsh)}.chips button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 80%,#fff),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.2)}
.btn.alt{background:var(--gc);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),0 6px 18px var(--glsh)}
.card .btn.alt{background:var(--sf2);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}.card .btn.alt::after{display:none}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,#fff),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.18)}.btn.alt{color:var(--ink)}
.card:not(.hero)::after,nav::after,.th::after,.back::after,.chips button::after,.btn.alt::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(145deg,var(--hi),transparent 35%,transparent 65%,var(--hi));opacity:.9;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.th,.back{box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),0 6px 20px var(--glsh)}
.hero{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(120,80,0,.18),0 18px 40px rgba(255,170,0,.28)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 15% -10%,rgba(255,255,255,.55),transparent 60%),radial-gradient(80% 50% at 100% 115%,rgba(255,255,255,.28),transparent 60%)}.hero>*{position:relative}
.hero .btn{background:linear-gradient(180deg,#2c2c29,#111)}
nav{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--gl);-webkit-backdrop-filter:blur(26px) saturate(220%);backdrop-filter:blur(26px) saturate(220%);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo),inset 0 0 18px rgba(255,255,255,.14),0 14px 34px var(--glsh)}
nav .pill{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1)),var(--pill);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -1px 2px rgba(120,80,0,.16),0 4px 14px rgba(190,140,10,.25)}
.edge{background:linear-gradient(to top,color-mix(in srgb,var(--bg) 70%,transparent),transparent)}
/* barra alta: il titolo piccolo appare solo quando quello grande è uscito */
.hd.sc .bt{opacity:0;translate:-50% 3px}.hd.tt .bt{opacity:1;translate:-50% 0}
/* card partita: dettagli a scomparsa */
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--drawer)}.more>div{overflow:hidden;min-height:0;opacity:0;transition:opacity .2s}.hero.open .more{grid-template-rows:1fr}.hero.open .more>div{opacity:1;transition-delay:.06s}
.v2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:20px}.v2 .ul{margin:0}
.tg{display:inline-flex;align-items:center;gap:6px;margin:16px auto 0;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:rgba(17,17,17,.75);background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 2px 8px rgba(120,80,0,.12);transition:transform .16s var(--out)}.tg:active{transform:scale(.97)}
.tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--drawer)}.hero.open .tg svg{transform:rotate(180deg)}.tg .t2,.hero.open .tg .t1{display:none}.hero.open .tg .t2{display:inline}
.hero .info{margin-top:16px}
/* calendario */

const miniTbl=(h,a)=>{const R=table(),rows=[h,a].map(t=>[R.findIndex(r=>r.i==t),t]).sort((x,y)=>x[0]-y[0]);return `<div class="md-r h"><span></span><span></span><span>PG</span><span>PV</span><span>PP</span><span>Set</span><span>Pt</span></div>${rows.map(([k,t])=>{const r=R[k]||{};return `<div class="md-r" data-t="${t}"><span>${k+1}</span><span class="tq">${logo(t,24)}<span>${T[t]}</span></span><span>${r.g??'–'}</span><span>${r.v??'–'}</span><span>${r.p??'–'}</span><span>${r.sv??'–'}-${r.sp??'–'}</span><b>${r.pt??'–'}</b></div>`}).join('')}`};
function mdHTML(m){const g=gym(m),h=m.h,a=m.a,sa=mstate(m),n=m.p?m.p.length:0,gap=Math.max(176,68+(n?8+22*n:0)+14);let mid;
if(sa=='fin'){const[x,y]=m.s;mid=`<div class="md-res"><span class="${x>y?'w':'l'}">${x}</span><i>-</i><span class="${y>x?'w':'l'}">${y}</span></div><span class="md-lb">Terminata</span>`+(n?`<div class="md-sets">${m.p.map(([p,q])=>`<div class="md-set"><span class="${p>q?'w':''}">${p}</span><i>-</i><span class="${q>p?'w':''}">${q}</span></div>`).join('')}</div>`:'<span class="md-lb">Parziali non disponibili</span>')}
else mid=`<b>${ft(m.d)}</b><span class="md-lb${sa=='live'?' live':''}">${sa=='cd'?fdays(m.d):sa=='live'?'In corso':'Partita terminata<br>In attesa dei risultati'}</span>`;
const wx=!m.s&&m.d.getTime()+108e5>Date.now();
return `<div class="md-bgw"><div class="md-bg"></div></div><div class="md-glow"></div><div class="md-bar"><button class="th" data-mdx aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>${navigator.share?'<button class="th" data-mds aria-label="Condividi"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>':'<span></span>'}</div>
<div class="md-head"><div class="md-teams"><div class="md-team" data-t="${h}">${logo(h,64)}<div class="md-nm">${T[h]}</div></div><div class="md-mid">${mid}</div><div class="md-team" data-t="${a}">${logo(a,64)}<div class="md-nm">${T[a]}</div></div></div></div>
<div class="md-scroll"><div class="md-gap" style="height:calc(env(safe-area-inset-top,0px) + 62px + 150px)"></div><div class="md-body" style="min-height:calc(100dvh - ${62+gap}px + 130px)">
<section class="card grp md-card"><div class="gt"><b>Luogo</b><span>${g.n.split(' · ')[1]||''}</span></div><div class="md-pad"><div class="md-row"><div><b>${g.n.split(' · ')[0]}</b><small>${g.a}</small></div><a class="btn y" href="${dir(g)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 11.5 20 4l-7.5 16-1.8-6.7z"/></svg>Indicazioni</a></div>${wx?'<div class="md-row"><span class="md-k">Meteo</span><div id="wx" class="md-wx">Caricamento…</div></div>':''}<div class="md-row"><span class="md-k">Giornata ${m.g}</span><span class="md-v">${fw(m.d)} · ${ft(m.d)}</span></div></div></section>
<section class="card grp md-card"><div class="gt"><b>Forma della squadra</b><span>Ultime 5</span></div><div class="md-pad"><div class="md-form"><div class="md-col">${fmRows(h,m)}</div><div class="md-col">${fmRows(a,m)}</div></div></div></section>
<section class="card grp md-card"><div class="gt"><b>Classifica</b><span>Attuale</span></div><div class="md-pad">${miniTbl(h,a)}</div></section></div></div>`}
let MDr=null,MDo=null;const TC=[...document.querySelectorAll('meta[name="theme-color"]')],TC0=TC.map(x=>x.content),tcSet=c=>TC.forEach((x,k)=>x.content=c||TC0[k]);
const mdR=()=>{md.style.setProperty('--sp',0);md.style.setProperty('--sb',0);md.style.setProperty('--sy',0)};
function mdGap(){const h=md.querySelector('.md-head'),g=md.querySelector('.md-gap'),b=md.querySelector('.md-body');if(!h||!g)return;const t=h.offsetHeight+30;g.style.height=`calc(env(safe-area-inset-top,0px) + 62px + ${t}px)`;b.style.minHeight=`calc(100dvh - ${62+t}px + 130px)`}
function mdFill(m){md.innerHTML=mdHTML(m);if(!m.s&&m.d.getTime()+108e5>Date.now())meteo(m).then(w=>{const e=$('#wx');if(e&&MDm==m)e.innerHTML=wxHTML(w)})}
function mdSwap(m){md.classList.remove('on');setTimeout(()=>{MDm=m;mdFill(m);mdR();mdGap();md.classList.add('on')},170)}
function openMd(el){const m=M.find(x=>x.id==el.dataset.m);if(!m)return;ST=$('.hd').offsetHeight-52;
if(!md.hidden){MS.push(MDm.id);mdSwap(m);return}
MS=[];MDm=m;MDo=el;mdFill(m);const r=el.getBoundingClientRect();MDr=r;md.hidden=false;mdGap();md.style.transition='none';md.classList.remove('closing','out');md.classList.add('opening');mdR();md.style.transform='';md.style.clipPath=`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 28px)`;void md.offsetWidth;md.style.transition='';requestAnimationFrame(()=>{md.classList.remove('opening');md.classList.add('on');md.style.clipPath='inset(0px 0px 0px 0px round 0px)'});document.documentElement.style.overflow='hidden';tcSet('#ffc72c')}
function openMdId(id){const m=M.find(x=>x.id==id);if(!m)return;MDm=m;MDo=null;MDr=null;mdFill(m);md.hidden=false;mdGap();md.style.transition='none';md.classList.remove('opening','closing','out');md.classList.add('on');mdR();md.style.clipPath='inset(0px 0px 0px 0px round 0px)';void md.offsetWidth;md.style.transition='';document.documentElement.style.overflow='hidden';tcSet('#ffc72c')}
function mdBack(){if(md.hidden)return;if(MS.length){const id=MS.pop(),m=M.find(x=>x.id==id);if(m)mdSwap(m)}else closeMd()}
function closeMd(fast){if(md.hidden)return;document.documentElement.style.overflow='';tcSet();const r=MDr;
if(fast){md.hidden=true;md.classList.remove('on','opening','closing','out');md.style.clipPath='';return}
if(!r||r.bottom<0||r.top>innerHeight){md.classList.add('out');setTimeout(()=>{md.hidden=true;md.classList.remove('on','opening','out');md.style.clipPath=''},300);return}
const k=r.width/innerWidth,Hh=r.height/k;md.classList.add('opening','closing');md.style.transformOrigin='0 0';md.style.transform=`translate(${r.left}px,${r.top}px) scale(${k})`;md.style.clipPath=`inset(0px 0px ${Math.max(0,innerHeight-Hh)}px 0px round ${28/k}px)`;
if(MDo&&document.contains(MDo)){const o=MDo;o.classList.add('hb');setTimeout(()=>o.classList.remove('hb'),700)}
setTimeout(()=>{md.hidden=true;md.classList.remove('on','opening','closing');md.style.clipPath='';md.style.transform='';md.style.transformOrigin=''},540)}
md.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('md-scroll')){const y=t.scrollTop;md.style.setProperty('--sp',Math.min(1,y/110));md.style.setProperty('--sb',Math.min(1,y/380));md.style.setProperty('--sy',y)}},true);
document.fonts&&document.fonts.ready.then(mdGap);
addEventListener('keydown',e=>{if(e.key=='Escape')mdBack();if(e.key=='Enter'&&e.target.dataset&&e.target.dataset.m)openMd(e.target)});
